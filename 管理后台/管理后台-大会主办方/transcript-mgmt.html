    function toggleParticipantDropdown(pId) {
      if (currentDebugStatus === 'not_started') {
        showToast('会议未开播，暂无声纹说话人可关联');
        return;
      }
      if (activeParticipantDropdownId === pId) {
        activeParticipantDropdownId = null;
        tempDropdownSelectedSpeakers = [];
      } else {
        activeParticipantDropdownId = pId;
        const p = participants.find(item => item.id === pId);
        tempDropdownSelectedSpeakers = p && p.assignedSpeakers ? [...p.assignedSpeakers] : [];

    // 渲染参会人列表 (下拉紧跟在名字后面，支持多选、点击保存后生效、取消已关联标签与清空按钮)
    function renderParticipants() {
      const listEl = document.getElementById('participantList');
      if (!listEl) return;

      const isNotStarted = (currentDebugStatus === 'not_started');

      // 统计已被其他参会人选中的说话人映射：speaker -> participant
      const occupiedMap = new Map();
      if (!isNotStarted) {
        participants.forEach(other => {
          if (other.assignedSpeakers && other.assignedSpeakers.length > 0) {
            other.assignedSpeakers.forEach(s => occupiedMap.set(s, other));
          }
        });
      }

      // 获取当前会议所有已出现或预设的说话人集合 (如 说话人1 ~ 说话人8)
      const standardSpeakers = Object.keys(KNOWN_SPEAKER_COLORS).filter(isRawSpeaker);

      const html = participants.map(p => {
        const currentSavedSelected = isNotStarted ? [] : (p.assignedSpeakers || []);
        const isDropdownOpen = (activeParticipantDropdownId === p.id);
        // 若下拉打开，显示临时勾选状态；关闭时显示已保存状态
        const currentSelected = isDropdownOpen ? tempDropdownSelectedSpeakers : currentSavedSelected;

        // 1. 触发器 Trigger 内容 (未开始时为空态；已选中紧凑平铺无x按钮)
        let triggerContentHtml = '';
        if (isNotStarted) {
          triggerContentHtml = '';
        } else if (currentSavedSelected.length === 0) {
          triggerContentHtml = `
            <div class="participant-speaker-select-trigger is-empty" onclick="event.stopPropagation(); toggleParticipantDropdown('${p.id}')" title="点击选择说话人">
              <span>未选择</span>
              <svg class="dropdown-arrow-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          `;
        } else {
          triggerContentHtml = `
            <div class="participant-speaker-select-trigger" onclick="event.stopPropagation(); toggleParticipantDropdown('${p.id}')" title="已关联: ${currentSavedSelected.join('、')}，点击修改">
              <div class="selected-speakers-chips">
                ${currentSavedSelected.map(s => `
                  <span class="selected-speaker-pill">
                    ${renderAvatarHtml(s, 14, 8)}
                    <span>${escapeHtml(s)}</span>
                  </span>
                `).join('')}
              </div>
              <svg class="dropdown-arrow-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          `;
        }

        // 2. 下拉菜单 Dropdown 展开时的选项内容
        let dropdownMenuHtml = '';
        if (isDropdownOpen && !isNotStarted) {
          const candMap = new Map();
          (p.candidates || []).forEach(c => candMap.set(c.speaker, c.score));

          const allSpeakerList = Array.from(new Set([
            ...Array.from(candMap.keys()),
            ...standardSpeakers,
            ...currentSelected
          ])).filter(isRawSpeaker);

          const availableList = [];
          const boundToOtherList = [];

          allSpeakerList.forEach(s => {
            const boundOther = occupiedMap.get(s);
            if (boundOther && boundOther.id !== p.id) {
              boundToOtherList.push({ speaker: s, boundTo: boundOther.name });
            } else {
              const isSelected = tempDropdownSelectedSpeakers.includes(s);
              const score = candMap.get(s) || 0;
              availableList.push({ speaker: s, isSelected, score });
            }
          });

          // 可选项排序：按置信度分数降序（不将选中的项置顶）
          availableList.sort((a, b) => b.score - a.score);

          const availableItemsHtml = availableList.map(item => {
            const jsParam = item.speaker.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `
              <div class="p-dropdown-item ${item.isSelected ? 'selected' : ''}" onclick="event.stopPropagation(); handleToggleParticipantSpeakerInDropdown('${p.id}', '${jsParam}')">
                <div class="p-dropdown-left">
                  <input type="checkbox" class="p-dropdown-checkbox" ${item.isSelected ? 'checked' : ''} onclick="event.stopPropagation(); handleToggleParticipantSpeakerInDropdown('${p.id}', '${jsParam}')">
                  ${renderAvatarHtml(item.speaker, 20, 10)}
                  <span class="p-dropdown-speaker-name">${escapeHtml(item.speaker)}</span>
                </div>
                ${item.score > 0 ? `<span class="p-dropdown-score">${item.score}%</span>` : ''}
              </div>
            `;
          }).join('');

          const boundItemsHtml = boundToOtherList.map(item => `
            <div class="p-dropdown-item is-disabled" title="已被【${escapeHtml(item.boundTo)}】绑定">
              <div class="p-dropdown-left">
                <input type="checkbox" class="p-dropdown-checkbox" disabled>
                ${renderAvatarHtml(item.speaker, 20, 10)}
                <span class="p-dropdown-speaker-name">${escapeHtml(item.speaker)}</span>
              </div>
              <span class="p-dropdown-bound-tag">-> ${escapeHtml(item.boundTo)}</span>
            </div>
          `).join('');

          dropdownMenuHtml = `
            <div class="participant-speaker-dropdown-menu" onclick="event.stopPropagation()">
              <div class="p-dropdown-header">
                <span>选择说话人 (支持多选)</span>
              </div>
              <div class="p-dropdown-list">
                ${availableItemsHtml}
                ${boundItemsHtml}
              </div>
              <div class="p-dropdown-footer" style="justify-content: flex-end;">
                <button class="btn-dropdown-done" onclick="event.stopPropagation(); handleSaveParticipantSpeakers('${p.id}')">保存</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="participant-card" id="pcard_${p.id}">
            <div class="participant-left-info">
              ${renderAvatarHtml(p.name, 34, 13)}
              <span class="participant-name">${escapeHtml(p.name)}</span>
              
              <!-- 下拉选择关联说话人容器：紧跟在名字后面，不置右 -->
              <div class="participant-speaker-select-container" id="pSelectContainer_${p.id}">
                ${triggerContentHtml}
                ${dropdownMenuHtml}
              </div>
            </div>

            <!-- 右上角 Hover 编辑按钮 -->
            <div class="participant-card-hover-mask">
              <button class="btn-edit-agenda-pill" onclick="event.stopPropagation(); openEditParticipantModal('${p.id}')" title="编辑参会人信息">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                编辑
              </button>
            </div>
          </div>
        `;
      }).join('');

      listEl.innerHTML = html;
    }

    // 在已结束模式下，对所有未人工确认的参会人执行 AI 自动匹配（按最高置信度排他）
    function runAutoAssignForEnded() {
      if (currentDebugStatus !== 'ended') return;

      const occupiedByManual = new Set();
      participants.forEach(p => {
        if (p.isManual && p.assignedSpeakers && p.assignedSpeakers.length > 0) {
          p.assignedSpeakers.forEach(s => occupiedByManual.add(s));
        }
      });

      participants.forEach(p => {
        if (!p.isManual) {
          if (p.assignedSpeakers && p.assignedSpeakers.length > 0) {
            const oldAuto = [...p.assignedSpeakers];
            p.assignedSpeakers = [];
            transcriptItems.forEach(t => {
              if (oldAuto.includes(t.rawSpeaker) && t.isAutoAssigned) {
                if (!t.isSingleOverride) {
                  t.speakerName = t.rawSpeaker;
                  t.isAutoAssigned = false;
                }
              }
            });
          }
        }
      });

      const occupied = new Set(occupiedByManual);
      participants.forEach(p => {
        if (!p.isManual) {
          const availableCand = (p.candidates || []).find(c => !occupied.has(c.speaker));
          if (availableCand) {
            p.assignedSpeakers = [availableCand.speaker];
            p.isManual = false;
            occupied.add(availableCand.speaker);

            transcriptItems.forEach(t => {
              if (t.rawSpeaker === availableCand.speaker) {
                if (!t.isSingleOverride) {
                  t.speakerName = p.name;
                  t.isAutoAssigned = true;
                }
              }
            });
          }
        }
      });
    }

    // 下拉框内多选临时勾选/反选（不实时生效）
    function handleToggleParticipantSpeakerInDropdown(participantId, speaker) {
      if (!speaker) return;
      const idx = tempDropdownSelectedSpeakers.indexOf(speaker);
      if (idx >= 0) {
        tempDropdownSelectedSpeakers.splice(idx, 1);
      } else {
        tempDropdownSelectedSpeakers.push(speaker);
      }
      renderParticipants();
    }

    // 点击下拉框内的“保存”按钮，正式提交生效 (单句独立标注具有最高优先级，不被参会人批量覆盖)
    function handleSaveParticipantSpeakers(participantId) {
      const p = participants.find(item => item.id === participantId);
      if (!p) return;

      const oldSpeakers = [...(p.assignedSpeakers || [])];
      const newSpeakers = [...tempDropdownSelectedSpeakers];

      p.assignedSpeakers = newSpeakers;
      p.isManual = (newSpeakers.length > 0);

      // 若新选中的说话人被其他参会人占用，将其从其他人身上解除
      newSpeakers.forEach(speaker => {
        participants.forEach(other => {
          if (other.id !== p.id && other.assignedSpeakers && other.assignedSpeakers.includes(speaker)) {
            other.assignedSpeakers = other.assignedSpeakers.filter(s => s !== speaker);
            if (other.assignedSpeakers.length === 0) other.isManual = false;
          }
        });
      });

      // 同步转写中对应的说话人 (跳过已单独标句子的条目，保持其最高优先级)
      transcriptItems.forEach(item => {
        if (newSpeakers.includes(item.rawSpeaker)) {
          if (!item.isSingleOverride) {
            item.speakerName = p.name;
            item.isAutoAssigned = false;
          }
        }
      });

      // 恢复被移除的旧关联
      oldSpeakers.filter(s => !newSpeakers.includes(s)).forEach(removedSpeaker => {
        transcriptItems.forEach(item => {
          if (item.rawSpeaker === removedSpeaker) {
            if (!item.isSingleOverride) {
              item.speakerName = item.rawSpeaker;
              item.isAutoAssigned = false;
            }
          }
        });
      });

      if (currentDebugStatus === 'ended') {
        runAutoAssignForEnded();
      }

      activeParticipantDropdownId = null;
      tempDropdownSelectedSpeakers = [];

      renderTranscripts();
      renderParticipants();
      showToast(`已成功保存【${p.name}】的说话人关联`);
    }

    // 点击已选小胶囊标签上的 ✕ 进行取消关联
    function handleRemoveSpeakerFromParticipant(participantId, speaker) {
      const p = participants.find(item => item.id === participantId);
      if (!p) return;

      if (activeParticipantDropdownId === participantId) {
        const idx = tempDropdownSelectedSpeakers.indexOf(speaker);
        if (idx >= 0) tempDropdownSelectedSpeakers.splice(idx, 1);
        renderParticipants();
      } else {
        if (p.assignedSpeakers) {
          p.assignedSpeakers = p.assignedSpeakers.filter(s => s !== speaker);
          if (p.assignedSpeakers.length === 0) p.isManual = false;
        }
        transcriptItems.forEach(item => {
          if (item.rawSpeaker === speaker) {
            if (!item.isSingleOverride) {
              item.speakerName = item.rawSpeaker;
              item.isAutoAssigned = false;
            }
          }
        });
        if (currentDebugStatus === 'ended') {
          runAutoAssignForEnded();
        }
        renderTranscripts();
        renderParticipants();
        showToast(`已取消【${p.name}】对【${speaker}】的关联`);
      }
    }

    function updateParticipantAvatarPreviewInModal(name, avatarUrl) {
      const box = document.getElementById('editParticipantAvatarPreviewBox');
      if (!box) return;

      if (avatarUrl) {
        box.innerHTML = `<img src="${avatarUrl}" alt="${escapeHtml(name)}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
      } else {
        const char = getSpeakerAvatarChar(name);
        box.innerHTML = `<span style="font-size: 22px; font-weight: 600; color: #4338ca; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: #e0e7ff;">${escapeHtml(char)}</span>`;
      }
    }

    function handleParticipantAvatarUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        editingParticipantAvatarData = evt.target.result;
        const name = document.getElementById('editParticipantName').value || '参';
        updateParticipantAvatarPreviewInModal(name, editingParticipantAvatarData);
      };
      reader.readAsDataURL(file);
    }

    function closeEditParticipantModal() {
      document.getElementById('editParticipantModal').classList.remove('show');
      editingParticipantId = null;
      editingParticipantAvatarData = null;
    }

    function saveParticipantEdit() {
      const newName = document.getElementById('editParticipantName').value.trim();
      const newHotwords = document.getElementById('editParticipantHotwords').value.trim();

      if (!newName) {
        alert('请输入参会人姓名');
        return;
      }

      if (editingParticipantId) {
        const p = participants.find(item => item.id === editingParticipantId);
        if (p) {
          const oldName = p.name;
          p.name = newName;
          p.hotwords = newHotwords;
          if (editingParticipantAvatarData) {
            p.avatarUrl = editingParticipantAvatarData;
            PRESET_PARTICIPANT_AVATARS[newName] = editingParticipantAvatarData;
          }

          // 同步转写中的发言人名
          if (oldName !== newName) {
            transcriptItems.forEach(t => {
              if (t.speakerName === oldName) {
                t.speakerName = newName;
              }
            });
            agendas.forEach(a => {
              if (a.speaker.includes(oldName)) {
                a.speaker = a.speaker.replace(new RegExp(oldName, 'g'), newName);
              }
            });
          }
          showToast(`已成功保存参会人【${newName}】的信息`);
        }
      } else {
        // 新增参会人
        addNewParticipant(newName, editingParticipantAvatarData || '', newHotwords);
        if (editingParticipantAvatarData) {
          PRESET_PARTICIPANT_AVATARS[newName] = editingParticipantAvatarData;
        }
        showToast(`已添加新参会人【${newName}】`);
      }

      renderAgendas();
      renderParticipants();
      renderTranscripts();
      closeEditParticipantModal();
    }

    // 新增参会人公共方法
    function addNewParticipant(name, avatarUrl = '', hotwords = '') {
      const newId = 'p_' + Date.now();
      const allSpeakers = ['说话人1', '说话人2', '说话人3', '说话人4', '说话人5', '说话人6', '说话人7'];
      const defaultCands = allSpeakers.map((spk, idx) => ({
        speaker: spk,
        score: Math.max(10, 85 - idx * 10)
      }));
      const newP = {
        id: newId,
        name: name,
        avatarUrl: avatarUrl || PRESET_PARTICIPANT_AVATARS[name] || '',
        hotwords: hotwords || `${name}, 具身智能, 大模型, 深度学习`,
        candidates: defaultCands,
        assignedSpeakers: [],
        isManual: false
      };
      participants.push(newP);
      renderParticipants();
      return newP;
    }

    // 二次确认删除状态与操作
    let pendingDeleteType = null; // 'agenda' | 'participant'
    let pendingDeleteId = null;

    function handleDeleteAgendaClick() {
      if (!editingAgendaId) return;
      const agenda = agendas.find(a => a.id === editingAgendaId);
      if (!agenda) return;

      pendingDeleteType = 'agenda';
      pendingDeleteId = editingAgendaId;
      document.getElementById('deleteConfirmHeaderTitle').textContent = '删除议程确认';
      document.getElementById('deleteConfirmBody').innerHTML = `确定要删除议程 <strong>【${escapeHtml(agenda.title || '未命名议程')}】</strong> 吗？`;
      document.getElementById('deleteConfirmModal').classList.add('show');
    }

    function handleDeleteParticipantClick() {
      if (!editingParticipantId) return;
      const p = participants.find(item => item.id === editingParticipantId);
      if (!p) return;

      pendingDeleteType = 'participant';
      pendingDeleteId = editingParticipantId;
      document.getElementById('deleteConfirmHeaderTitle').textContent = '删除参会人确认';
      document.getElementById('deleteConfirmBody').innerHTML = `确定要删除参会人 <strong>【${escapeHtml(p.name)}】</strong> 吗？`;
      document.getElementById('deleteConfirmModal').classList.add('show');
    }

    function closeDeleteConfirmModal() {
      document.getElementById('deleteConfirmModal').classList.remove('show');
      pendingDeleteType = null;
      pendingDeleteId = null;
    }

    function executePendingDelete() {
      if (pendingDeleteType === 'agenda' && pendingDeleteId) {
        const idx = agendas.findIndex(a => a.id === pendingDeleteId);
        if (idx !== -1) {
          const deletedTitle = agendas[idx].title || '议程';
          agendas.splice(idx, 1);

          // 清除相关边界冲突缓存
          for (const k in boundarySources) {
            if (k.startsWith(pendingDeleteId + '_') || k.endsWith('_' + pendingDeleteId)) {
              delete boundarySources[k];
            }
          }

          if (agendas.length > 0 && !agendas.some(a => a.active)) {
            agendas[0].active = true;
          }

          syncParticipantsFromAgendas();
          renderAgendas();
          renderParticipants();
          renderTranscripts();
          closeDeleteConfirmModal();
          closeEditAgendaModal();
          showToast(`已成功删除议程【${deletedTitle}】`);
        }
      } else if (pendingDeleteType === 'participant' && pendingDeleteId) {
        const idx = participants.findIndex(p => p.id === pendingDeleteId);
        if (idx !== -1) {
          const p = participants[idx];
          const deletedName = p.name;

          // 解除关联的声纹说话人并还原
          if (p.assignedSpeakers && p.assignedSpeakers.length > 0) {
            transcriptItems.forEach(item => {
              if (p.assignedSpeakers.includes(item.rawSpeaker)) {
                if (!item.isSingleOverride && item.speakerName === p.name) {
                  item.speakerName = item.rawSpeaker;
                  item.isAutoAssigned = false;
                }
              }
            });
          }

          participants.splice(idx, 1);

          if (currentDebugStatus === 'ended') {
            runAutoAssignForEnded();
          }

          renderParticipants();
          renderTranscripts();
          closeDeleteConfirmModal();
          closeEditParticipantModal();
          showToast(`已成功删除参会人【${deletedName}】`);
        }
      }
    }

    // 添加参会人按钮触发
    function handleAddParticipantPrompt() {
      openEditParticipantModal(null);
    }

    // 渲染右侧速记流（时间正序向下流，最新内容在最底部）
    function renderTranscripts(filterVal = '') {
      const streamEl = document.getElementById('transcriptStream');
      if (!streamEl) return;

      if (currentDebugStatus === 'not_started') {
        streamEl.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 60px 0; font-size: 13.5px;">直播未开始</div>`;
        return;
      }

      let items = transcriptItems;
      if (currentDebugStatus === 'in_progress') {
        items = transcriptItems.filter(t => t.agendaId !== 'c5');
      }

      if (filterVal && filterVal.trim()) {
        const q = filterVal.trim().toLowerCase();
        items = items.filter(t => t.speakerName.toLowerCase().includes(q) || t.text.toLowerCase().includes(q));
      }

      if (items.length === 0) {
        streamEl.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 40px 0; font-size: 14px;">无匹配发言内容</div>`;
        return;
      }

      streamEl.innerHTML = items.map(item => {
        const isAuto = !!item.isAutoAssigned;
        return `
        <div class="transcript-item" id="item_${item.id}">
          <!-- 头像 说话人 时间 所在行 -->
          <div class="speaker-meta-row" id="meta_${item.id}">
            ${renderAvatarHtml(item.speakerName, 30, 13)}
            
            <div class="speaker-name-wrapper ${isAuto ? 'ai-auto-assigned' : ''}" id="speakerBtn_${item.id}" onclick="toggleSpeakerPopover(event, '${item.id}')" title="${isAuto ? 'AI自动推断标注（虚线标识），点击可修改' : '点击修改说话人'}">
              <span class="speaker-name-text">${escapeHtml(item.speakerName)}</span>
              <svg class="speaker-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </div>

            <span class="speaker-time-stamp">${item.time}</span>
          </div>

          <!-- 文本内容 -->
          <div class="transcript-text-container" id="textContainer_${item.id}">
            <div class="transcript-text-content" ondblclick="enableEditText('${item.id}')" title="双击可直接修改内容">
              ${escapeHtml(item.text)}
            </div>
          </div>
        </div>
      `;
      }).join('');

      handleTranscriptScroll();
    }

    // 动态计算并适配 Textarea 高度
    function autoResizeTextarea(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // 搜索速记
    function handleSearchTranscript(val) {
      renderTranscripts(val);
    }

    // 局部双击编辑文本，零刷新
    function enableEditText(id) {
      const container = document.getElementById(`textContainer_${id}`);
      const item = transcriptItems.find(t => t.id === id);
      if (!container || !item) return;

      editingTranscriptId = id;
      container.innerHTML = `
        <div class="transcript-edit-box">
          <textarea class="transcript-textarea" id="textarea_${id}" oninput="autoResizeTextarea(this)">${escapeHtml(item.text)}</textarea>
          <div class="edit-actions-row">
            <button class="btn-edit-cancel" onclick="cancelEditText('${id}')">取消</button>
            <button class="btn-edit-save" onclick="saveEditText('${id}')">保存</button>
          </div>
        </div>
      `;

      const ta = document.getElementById(`textarea_${id}`);
      if (ta) {
        autoResizeTextarea(ta);
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
    }

    function cancelEditText(id) {
      const container = document.getElementById(`textContainer_${id}`);
      const item = transcriptItems.find(t => t.id === id);
      if (!container || !item) return;

      editingTranscriptId = null;
      container.innerHTML = `
        <div class="transcript-text-content" ondblclick="enableEditText('${id}')" title="双击可直接修改内容">
          ${escapeHtml(item.text)}
        </div>
      `;
    }

    function saveEditText(id) {
      const ta = document.getElementById(`textarea_${id}`);
      const item = transcriptItems.find(t => t.id === id);
      if (ta && item) {
        item.text = ta.value.trim();
      }
      cancelEditText(id);
    }

    // 丝滑局部打开/关闭说话人 Popover，绝不全局重新渲染
    function toggleSpeakerPopover(e, id) {
      e.stopPropagation();
      const metaRow = document.getElementById(`meta_${id}`);
      const btn = document.getElementById(`speakerBtn_${id}`);
      if (!metaRow || !btn) return;

      const existingPopover = document.getElementById('activeSpeakerPopover');
      if (existingPopover) {
        const parentId = existingPopover.dataset.itemId;
        existingPopover.remove();
        document.querySelectorAll('.speaker-name-wrapper').forEach(w => w.classList.remove('popover-active'));
        if (parentId === id) {
          activeSpeakerPopoverId = null;
          return;
        }
      }

      activeSpeakerPopoverId = id;
      btn.classList.add('popover-active');

      const popoverEl = document.createElement('div');
      popoverEl.id = 'activeSpeakerPopover';
      popoverEl.dataset.itemId = id;
      popoverEl.className = 'speaker-dropdown-popover';
      popoverEl.onclick = function (event) { event.stopPropagation(); };
      popoverEl.innerHTML = renderPopoverMainViewHtml(id);

      metaRow.appendChild(popoverEl);
      updatePopoverSaveBtnState(id);
      setTimeout(() => {
        const inp = document.getElementById(`popoverSearchInput_${id}`);
        if (inp) inp.focus();
      }, 50);
    }

    function closeSpeakerPopover() {
      const existingPopover = document.getElementById('activeSpeakerPopover');
      if (existingPopover) {
        existingPopover.remove();
        document.querySelectorAll('.speaker-name-wrapper').forEach(w => w.classList.remove('popover-active'));
        activeSpeakerPopoverId = null;
        currentPopoverSelectedSpeaker = null;
      }
    }

    let currentPopoverSelectedSpeaker = null;

    // 渲染 Popover 单界面：顶部搜索框 + 参会人单选/反选列表/添加项 + 底部操作栏(批量勾选+保存)
    function renderPopoverMainViewHtml(itemId) {
      const tItem = transcriptItems.find(t => t.id === itemId);
      if (!tItem) return '';

      const currentSpeaker = tItem.speakerName || '';
      // 如果当前不是原始说话人格式（如“说话人1”）且不是未选择，则初始选中该参会人
      if (currentSpeaker && !isRawSpeaker(currentSpeaker) && currentSpeaker !== '未选择') {
        currentPopoverSelectedSpeaker = currentSpeaker;
      } else {
        currentPopoverSelectedSpeaker = null;
      }

      const matchRaw = tItem.rawSpeaker || currentSpeaker;
      const matchCount = transcriptItems.filter(t => (t.rawSpeaker === matchRaw || t.speakerName === currentSpeaker)).length;
      const speakerLabel = tItem.rawSpeaker || currentSpeaker;

      return `
        <div class="popover-search-row">
          <svg class="popover-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="popover-search-input" id="popoverSearchInput_${itemId}" placeholder="搜索或输入参会人姓名..." oninput="handlePopoverSearchInput('${itemId}')" onkeydown="if(event.key==='Enter') handlePopoverSearchEnter('${itemId}')" autofocus>
          <button class="btn-clear-search" id="popoverClearSearchBtn_${itemId}" onclick="clearPopoverSearch('${itemId}')" style="display: none;">✕</button>
        </div>

        <div class="popover-options-list" id="popoverOptionsList_${itemId}">
          ${renderPopoverOptionsItemsHtml(itemId, '')}
        </div>

        <div class="popover-footer-row">
          <label class="popover-batch-checkbox-label" title="勾选后将自动批量替换当前论坛中所有 ${matchCount} 处发言">
            <input type="checkbox" id="popoverBatchCheckbox_${itemId}" onchange="updatePopoverSaveBtnState('${itemId}')">
            <span class="batch-checkbox-text">批量修改 <b id="popoverBatchCount_${itemId}">${matchCount}</b> 处【${escapeHtml(speakerLabel)}】</span>
          </label>
          <button class="btn-popover-save" id="popoverSaveBtn_${itemId}" onclick="handleSavePopoverSpeakerChange('${itemId}')" disabled>保存</button>
        </div>
      `;
    }

    // 检测当前是否有发生有效修改（支持单选与反选取消选择）
    function checkPopoverHasChanges(itemId) {
      const tItem = transcriptItems.find(t => t.id === itemId);
      if (!tItem) return false;

      const checkbox = document.getElementById(`popoverBatchCheckbox_${itemId}`);
      const isBatch = checkbox ? checkbox.checked : false;
      const targetSpeaker = currentPopoverSelectedSpeaker || (tItem.rawSpeaker || '未选择');

      if (isBatch) {
        const matchRaw = tItem.rawSpeaker || tItem.speakerName;
        const itemsToChange = transcriptItems.filter(item =>
          (item.rawSpeaker === matchRaw || item.speakerName === tItem.speakerName) && item.speakerName !== targetSpeaker
        );
        return itemsToChange.length > 0;
      } else {
        return tItem.speakerName !== targetSpeaker;
      }
    }

    // 刷新保存按钮的可用/置灰状态
    function updatePopoverSaveBtnState(itemId) {
      const saveBtn = document.getElementById(`popoverSaveBtn_${itemId}`);
      if (!saveBtn) return;
      const hasChanges = checkPopoverHasChanges(itemId);
      saveBtn.disabled = !hasChanges;
    }

    // 动态渲染搜索过滤后的候选参会人与“添加{输入内容}为说话人”（单选，支持点击选中/再次点击取消选择）
    function renderPopoverOptionsItemsHtml(itemId, query = '') {
      const tItem = transcriptItems.find(t => t.id === itemId);
      if (!tItem) return '';

      const q = (query || '').trim().toLowerCase();
      const rawSpk = tItem.rawSpeaker;
      const filtered = participants.filter(p => !q || p.name.toLowerCase().includes(q));

      let itemsHtml = filtered.map(p => {
        const isSelected = (p.name === currentPopoverSelectedSpeaker);
        const jsParamName = p.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return `
          <div class="popover-option-item ${isSelected ? 'selected' : ''}" onclick="event.stopPropagation(); handleSelectSpeakerInPopover('${itemId}', '${jsParamName}')">
            <div class="popover-option-left">
              ${renderAvatarHtml(p.name, 26, 11)}
              <span class="popover-option-name">${escapeHtml(p.name)}</span>
            </div>
            <div class="popover-option-radio-indicator"></div>
          </div>
        `;
      }).join('');

      // 输入了内容且列表无完全重名项时，展示“添加{输入内容}为说话人”
      let addCustomHtml = '';
      const hasExactMatch = participants.some(p => p.name.toLowerCase() === q);
      if (q && !hasExactMatch) {
        const escapedQuery = escapeHtml(query.trim());
        const jsParamQuery = query.trim().replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        addCustomHtml = `
          <div class="popover-add-custom-option" onclick="event.stopPropagation(); handleAddCustomSpeakerInPopover('${itemId}', '${jsParamQuery}')">
            <div class="popover-add-icon">+</div>
            <div class="popover-add-text">添加 <b>"${escapedQuery}"</b> 为说话人</div>
          </div>
        `;
      }

      if (!itemsHtml && !addCustomHtml) {
        return `<div style="text-align: center; color: #94a3b8; font-size: 12px; padding: 16px 0;">未找到相关参会人</div>`;
      }

      return itemsHtml + addCustomHtml;
    }

    function handlePopoverSearchInput(itemId) {
      const input = document.getElementById(`popoverSearchInput_${itemId}`);
      const clearBtn = document.getElementById(`popoverClearSearchBtn_${itemId}`);
      const listEl = document.getElementById(`popoverOptionsList_${itemId}`);
      if (!input || !listEl) return;

      const query = input.value;
      if (clearBtn) clearBtn.style.display = query ? 'inline-block' : 'none';
      listEl.innerHTML = renderPopoverOptionsItemsHtml(itemId, query);
    }

    function handlePopoverSearchEnter(itemId) {
      const input = document.getElementById(`popoverSearchInput_${itemId}`);
      if (!input || !input.value.trim()) return;
      const val = input.value.trim();
      const existing = participants.find(p => p.name === val);
      if (existing) {
        handleSelectSpeakerInPopover(itemId, existing.name);
      } else {
        handleAddCustomSpeakerInPopover(itemId, val);
      }
    }

    function clearPopoverSearch(itemId) {
      const input = document.getElementById(`popoverSearchInput_${itemId}`);
      const clearBtn = document.getElementById(`popoverClearSearchBtn_${itemId}`);
      if (input) {
        input.value = '';
        input.focus();
      }
      if (clearBtn) clearBtn.style.display = 'none';
      const listEl = document.getElementById(`popoverOptionsList_${itemId}`);
      if (listEl) listEl.innerHTML = renderPopoverOptionsItemsHtml(itemId, '');
      updatePopoverSaveBtnState(itemId);
    }

    // 单选/反选说话人：点一下选中，再点一下取消选择
    function handleSelectSpeakerInPopover(itemId, speakerName) {
      if (currentPopoverSelectedSpeaker === speakerName) {
        currentPopoverSelectedSpeaker = null; // 再次点击取消选择
      } else {
        currentPopoverSelectedSpeaker = speakerName; // 点击选中
      }

      const input = document.getElementById(`popoverSearchInput_${itemId}`);
      const query = input ? input.value : '';
      const listEl = document.getElementById(`popoverOptionsList_${itemId}`);
      if (listEl) listEl.innerHTML = renderPopoverOptionsItemsHtml(itemId, query);
      updatePopoverSaveBtnState(itemId);
    }

    // 点击“添加{输入内容}为说话人”：自动新增并选中
    function handleAddCustomSpeakerInPopover(itemId, newName) {
      if (!newName || !newName.trim()) return;
      newName = newName.trim();

      let p = participants.find(item => item.name === newName);
      if (!p) {
        p = addNewParticipant(newName);
      }

      currentPopoverSelectedSpeaker = newName;

      const input = document.getElementById(`popoverSearchInput_${itemId}`);
      if (input) {
        input.value = '';
        input.focus();
      }
      const clearBtn = document.getElementById(`popoverClearSearchBtn_${itemId}`);
      if (clearBtn) clearBtn.style.display = 'none';

      const listEl = document.getElementById(`popoverOptionsList_${itemId}`);
      if (listEl) listEl.innerHTML = renderPopoverOptionsItemsHtml(itemId, '');
      updatePopoverSaveBtnState(itemId);
      showToast(`已添加【${newName}】并设为选中`);
    }

    // 点击底部“保存”
    function handleSavePopoverSpeakerChange(itemId) {
      const checkbox = document.getElementById(`popoverBatchCheckbox_${itemId}`);
      const isBatch = checkbox ? checkbox.checked : false;

      applySpeakerChange(itemId, currentPopoverSelectedSpeaker, isBatch);
    }

    // 执行修改说话人 (单选、取消选择恢复原始声纹、单句最高优先级)
    function applySpeakerChange(itemId, targetSpeaker, isBatch = false) {
      const tItem = transcriptItems.find(t => t.id === itemId);
      if (!tItem) {
        closeSpeakerPopover();
        return;
      }

      const oldSpeaker = tItem.speakerName;
      const rawSpk = tItem.rawSpeaker || oldSpeaker;

      if (!targetSpeaker || targetSpeaker === rawSpk) {
        // 取消选择 / 恢复原始声纹说话人
        const speakerToRestore = rawSpk || '未选择';

        if (isBatch) {
          // 解除所有参会人中对该 rawSpk 的关联
          participants.forEach(p => {
            if (p.assignedSpeakers && p.assignedSpeakers.includes(rawSpk)) {
              p.assignedSpeakers = p.assignedSpeakers.filter(s => s !== rawSpk);
              if (p.assignedSpeakers.length === 0) p.isManual = false;
            }
          });

          let count = 0;
          transcriptItems.forEach(item => {
            if (item.rawSpeaker === rawSpk || (oldSpeaker && item.speakerName === oldSpeaker)) {
              item.speakerName = item.rawSpeaker;
              item.isAutoAssigned = false;
              item.isSingleOverride = false;
              count++;
            }
          });

          if (currentDebugStatus === 'ended') {
            runAutoAssignForEnded();
          }

          renderTranscripts();
          renderParticipants();
          showToast(`已取消【${rawSpk}】的参会人绑定，恢复原始说话人 (共 ${count} 处)`);
        } else {
          // 单句恢复：重置单句覆盖标记
          tItem.speakerName = speakerToRestore;
          tItem.isAutoAssigned = false;
          tItem.isSingleOverride = false;
          renderTranscripts();
          renderParticipants();
          showToast(`已取消当前单句说话人，恢复为【${speakerToRestore}】`);
        }
      } else {
        // 选中参会人
        let p = participants.find(item => item.name === targetSpeaker);
        if (!p) {
          addNewParticipant(targetSpeaker);
        }

        if (isBatch) {
          const targetP = participants.find(item => item.name === targetSpeaker);
          if (targetP) {
            if (!targetP.assignedSpeakers) targetP.assignedSpeakers = [];
            if (!targetP.assignedSpeakers.includes(rawSpk)) {
              targetP.assignedSpeakers.push(rawSpk);
            }
            targetP.isManual = true;
          }

          // 从其他未被选中的参会人身上解除该 rawSpk
          participants.forEach(other => {
            if (other.name !== targetSpeaker && other.assignedSpeakers && other.assignedSpeakers.includes(rawSpk)) {
              other.assignedSpeakers = other.assignedSpeakers.filter(s => s !== rawSpk);
              if (other.assignedSpeakers.length === 0) other.isManual = false;
            }
          });

          let replacedCount = 0;
          transcriptItems.forEach(item => {
            if (item.rawSpeaker === rawSpk || (oldSpeaker && item.speakerName === oldSpeaker)) {
              item.speakerName = targetSpeaker;
              item.isAutoAssigned = false;
              item.isSingleOverride = false;
              replacedCount++;
            }
          });

          if (currentDebugStatus === 'ended') {
            runAutoAssignForEnded();
          }

          renderTranscripts();
          renderParticipants();
          showToast(`已将全部【${rawSpk}】统一标注为【${targetSpeaker}】(共 ${replacedCount} 处)`);
        } else {
          // 单句修改：独立设置最高优先级单句覆盖标记 isSingleOverride = true
          tItem.speakerName = targetSpeaker;
          tItem.isAutoAssigned = false;
          tItem.isSingleOverride = true;
          renderTranscripts();
          renderParticipants();
          showToast(`已将当前单句单独标记为【${targetSpeaker}】(单句最高优先级)`);
        }
      }

      closeSpeakerPopover();
    }

    // 局部更新单个条目的说话人与头像 DOM (支持真实照片与黑金配色)
    function updateSpeakerDomInPlace(itemId, speakerName, isAuto = false) {
      const metaRow = document.getElementById(`meta_${itemId}`);
      if (!metaRow) return;

      const avatarEl = metaRow.querySelector('.speaker-avatar-circle');
      if (avatarEl) {
        avatarEl.outerHTML = renderAvatarHtml(speakerName, 30, 13);
      }

      const nameWrapper = metaRow.querySelector('.speaker-name-wrapper');
      if (nameWrapper) {
        if (isAuto) {
          nameWrapper.classList.add('ai-auto-assigned');
          nameWrapper.title = 'AI自动推断标注（虚线标识），点击可修改';
        } else {
          nameWrapper.classList.remove('ai-auto-assigned');
          nameWrapper.title = '点击修改说话人';
        }
      }

      const nameSpan = metaRow.querySelector('.speaker-name-text');
      if (nameSpan) {
        nameSpan.textContent = speakerName;
      }
    }

    // 全局 Toast 提示组件
    let toastTimer = null;
    function showToast(msg) {
      let toast = document.getElementById('globalToastNotice');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'globalToastNotice';
        toast.className = 'toast-notice';
        document.body.appendChild(toast);
      }

      toast.innerHTML = `
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
        <span>${escapeHtml(msg)}</span>
      `;

      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 全局与参会人热词整合 Modal
    function openHotwordsModal() {
      const modal = document.getElementById('hotwordsModal');
      const globalInput = document.getElementById('globalHotwordsInput');
      const listEl = document.getElementById('participantHotwordsList');

      if (globalInput) globalInput.value = globalHotwords;

      if (listEl) {
        listEl.innerHTML = participants.map(p => `
          <div class="participant-hotword-row" id="pHotwordRow_${p.id}">
            <div class="participant-hotword-label">
              <span class="participant-hotword-name">${escapeHtml(p.name)}</span>
            </div>
            <textarea class="participant-hotword-textarea" id="hotwordInput_${p.id}" placeholder="输入 ${escapeHtml(p.name)} 专属热词...">${escapeHtml(p.hotwords || '')}</textarea>
          </div>
        `).join('');
      }

      modal.classList.add('show');
      if (globalInput) {
        setTimeout(() => globalInput.focus(), 100);
      }
    }

    function closeHotwordsModal() {
      document.getElementById('hotwordsModal').classList.remove('show');
    }

    function saveHotwords() {
      const globalInput = document.getElementById('globalHotwordsInput');
      if (globalInput) {
        globalHotwords = globalInput.value.trim();
      }

      participants.forEach(p => {
        const pInput = document.getElementById(`hotwordInput_${p.id}`);
        if (pInput) {
          p.hotwords = pInput.value.trim();
        }
      });

      renderParticipants();
      closeHotwordsModal();
      showToast('已成功保存热词配置');
    }

    let activeParticipantHotwordsId = null;

    function openParticipantSingleHotwordsModal(pId) {
      activeParticipantHotwordsId = pId;
      const p = participants.find(item => item.id === pId);
      if (!p) return;

      const modal = document.getElementById('participantSingleHotwordsModal');
      const titleEl = document.getElementById('participantSingleHotwordsModalTitle');
      const inputEl = document.getElementById('participantSingleHotwordsInput');

      titleEl.textContent = `参会人热词 - ${p.name}`;
      inputEl.value = p.hotwords || '';

      modal.classList.add('show');
      setTimeout(() => {
        inputEl.focus();
        inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      }, 100);
    }

    function closeParticipantSingleHotwordsModal() {
      document.getElementById('participantSingleHotwordsModal').classList.remove('show');
      activeParticipantHotwordsId = null;
    }

    function saveParticipantSingleHotwords() {
      if (!activeParticipantHotwordsId) return;
      const inputEl = document.getElementById('participantSingleHotwordsInput');
      const p = participants.find(item => item.id === activeParticipantHotwordsId);
      if (p && inputEl) {
        p.hotwords = inputEl.value.trim();
      }
      renderParticipants();
      closeParticipantSingleHotwordsModal();
      showToast(`已成功保存【${p ? p.name : ''}】的热词`);
    }

    // ==========================================
    // 爬取热词逻辑 (增量更新 / 覆盖更新 + 状态禁用)
    // ==========================================
    let currentCrawlContext = null; // 'global' | 'single' | 'edit'
    let currentCrawlMode = 'incremental'; // 'incremental' | 'overwrite'

    function triggerCrawlHotwords(context) {
      currentCrawlContext = context;
      selectCrawlMode('incremental');
      document.getElementById('crawlHotwordsConfirmModal').classList.add('show');
    }

    function selectCrawlMode(mode) {
      currentCrawlMode = mode;
      const radioInc = document.getElementById('crawlRadioIncremental');
      const radioOvr = document.getElementById('crawlRadioOverwrite');
      const cardInc = document.getElementById('crawlModeCardIncremental');
      const cardOvr = document.getElementById('crawlModeCardOverwrite');

      if (radioInc && radioOvr && cardInc && cardOvr) {
        if (mode === 'incremental') {
          radioInc.checked = true;
          cardInc.classList.add('selected');
          cardOvr.classList.remove('selected');
        } else {
          radioOvr.checked = true;
          cardOvr.classList.add('selected');
          cardInc.classList.remove('selected');
        }
      }
    }

    function closeCrawlConfirmModal() {
      document.getElementById('crawlHotwordsConfirmModal').classList.remove('show');
      currentCrawlContext = null;
    }

    function confirmAndExecuteCrawl() {
      const mode = currentCrawlMode;
      const context = currentCrawlContext;
      closeCrawlConfirmModal();

      let targetBtn = null;
      let textareasToDisable = [];

      if (context === 'global') {
        targetBtn = document.getElementById('btnCrawlGlobalHotwords');
        const gInput = document.getElementById('globalHotwordsInput');
        if (gInput) textareasToDisable.push(gInput);
        document.querySelectorAll('.participant-hotword-textarea').forEach(ta => textareasToDisable.push(ta));
      } else if (context === 'single') {
        targetBtn = document.getElementById('btnCrawlSingleHotwords');
        const sInput = document.getElementById('participantSingleHotwordsInput');
        if (sInput) textareasToDisable.push(sInput);
      } else if (context === 'edit') {
        targetBtn = document.getElementById('btnCrawlParticipantEdit');
        const eInput = document.getElementById('editParticipantHotwords');
        if (eInput) textareasToDisable.push(eInput);
      }

      let origBtnHtml = '';
      if (targetBtn) {
        origBtnHtml = targetBtn.innerHTML;
        targetBtn.disabled = true;
        targetBtn.classList.add('is-crawling');
        targetBtn.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
            <line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
          </svg>
          爬取热词中...
        `;
      }

      textareasToDisable.forEach(ta => {
        if (ta) ta.disabled = true;
      });

      setTimeout(() => {
        const crawlCandidates = [
          '具身大模型', '端到端控制', '强化学习', 'VLA模型', '开源生态', '机器视觉', '自适应抓取', '智源AI前沿', '脉冲神经网络'
        ];

        function applyHotwordUpdate(textarea, newCandidates) {
          if (!textarea) return;
          if (mode === 'overwrite') {
            textarea.value = newCandidates.slice(0, 4).join('、');
          } else {
            let currentVal = textarea.value.trim();
            const existingList = currentVal ? currentVal.split(/[,，、;；\n]/).map(w => w.trim()).filter(Boolean) : [];
            const toAdd = newCandidates.filter(w => !existingList.includes(w)).slice(0, 3);
            if (toAdd.length > 0) {
              if (currentVal.length > 0 && !currentVal.endsWith(',') && !currentVal.endsWith('，') && !currentVal.endsWith('、') && !currentVal.endsWith(';')) {
                currentVal += '、';
              }
              currentVal += toAdd.join('、');
              textarea.value = currentVal;
            }
          }
        }

        if (context === 'global') {
          const globalInput = document.getElementById('globalHotwordsInput');
          applyHotwordUpdate(globalInput, crawlCandidates);
          document.querySelectorAll('.participant-hotword-textarea').forEach(ta => {
            applyHotwordUpdate(ta, crawlCandidates);
          });
        } else if (context === 'single') {
          const inputEl = document.getElementById('participantSingleHotwordsInput');
          applyHotwordUpdate(inputEl, crawlCandidates);
        } else if (context === 'edit') {
          const editInput = document.getElementById('editParticipantHotwords');
          applyHotwordUpdate(editInput, crawlCandidates);
        }

        if (targetBtn) {
          targetBtn.disabled = false;
          targetBtn.classList.remove('is-crawling');
          targetBtn.innerHTML = origBtnHtml;
        }

        textareasToDisable.forEach(ta => {
          if (ta) ta.disabled = false;
        });

        showToast(mode === 'incremental' ? '已增量提取并追加热词' : '已覆盖更新热词');
      }, 800);
    }

    // ==========================================
    // 屏蔽词管理 Modal 逻辑 (全局单多行输入框)
    // ==========================================
    function openBlockedWordsModal() {
      const modal = document.getElementById('blockedWordsModal');
      const input = document.getElementById('globalBlockedWordsInput');
      if (input) input.value = globalBlockedWords;
      modal.classList.add('show');
      if (input) {
        setTimeout(() => {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }, 100);
      }
    }

    function closeBlockedWordsModal() {
      document.getElementById('blockedWordsModal').classList.remove('show');
    }

    function saveBlockedWords() {
      const input = document.getElementById('globalBlockedWordsInput');
      if (input) {
        globalBlockedWords = input.value.trim();
      }
      closeBlockedWordsModal();
    }

    function handlePresetBlockedWords() {
      const presetCandidates = ['内部绝密', '扫码进群', '加微信领资料', '兼职刷单', '稳赚不赔', '独家泄密', '私信免费领', '招商加盟热线'];
      const input = document.getElementById('globalBlockedWordsInput');
      if (input) {
        let cur = input.value.trim();
        const newWords = presetCandidates.filter(w => !cur.includes(w));
        if (newWords.length > 0) {
          if (cur.length > 0 && !cur.endsWith(',') && !cur.endsWith('，')) {
            cur += ', ';
          }
          cur += newWords.join(', ');
        }
        input.value = cur;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
