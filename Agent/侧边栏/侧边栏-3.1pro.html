<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulAgent - 多Agent任务协作中心</title>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* Color Palette */
            --bg-body: #05050A;
            --bg-sidebar: rgba(18, 18, 25, 0.65);
            --bg-hover: rgba(255, 255, 255, 0.04);
            --bg-active: rgba(255, 255, 255, 0.08);
            --bg-card: rgba(30, 30, 40, 0.5);
            
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(99, 102, 241, 0.3);
            
            /* Typography Colors */
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-tertiary: #64748B;
            
            /* Accents */
            --accent-blue: #3B82F6;
            --accent-purple: #8B5CF6;
            --accent-green: #10B981;
            --accent-rose: #F43F5E;
            --accent-gradient: linear-gradient(135deg, #6366F1, #8B5CF6, #D946EF);
            
            --sidebar-width: 320px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            /* Added a subtle background pattern/glow to make it feel premium */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.08) 0%, transparent 50%);
        }

        /* --- Sidebar Container --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-sidebar);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* --- 1. Header (User & Workspace) --- */
        .sidebar-header {
            padding: 24px 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid transparent; /* Smooth transition area */
        }

        .workspace-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-md);
            transition: background 0.2s;
        }

        .workspace-info:hover {
            background: var(--bg-hover);
        }

        .workspace-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .workspace-name {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .workspace-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* --- Scrollable Area --- */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 100px 12px; /* Bottom padding for fixed button */
            scrollbar-width: none; /* Firefox */
        }
        .sidebar-content::-webkit-scrollbar {
            display: none; /* Chrome */
        }

        /* --- 2. Dashboard / Inbox --- */
        .nav-section {
            margin-bottom: 24px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            position: relative;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--bg-active);
            color: var(--text-primary);
        }

        .nav-item i {
            width: 18px;
            height: 18px;
        }

        .badge {
            background: var(--accent-rose);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 12px;
            margin-left: auto;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }

        /* --- 3. Your Team (Agents & Tasks) --- */
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            font-weight: 700;
            margin: 24px 0 12px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .agent-group {
            margin-bottom: 8px;
        }

        /* Agent Header (Parent) */
        .agent-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .agent-header:hover {
            background: var(--bg-card);
        }

        .agent-avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
        }

        .agent-avatar.blue { color: #60A5FA; background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.2); }
        .agent-avatar.purple { color: #A78BFA; background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.2); }
        .agent-avatar.green { color: #34D399; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); }

        .agent-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .agent-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .agent-role {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .chevron-icon {
            color: var(--text-tertiary);
            transition: transform 0.3s;
            width: 16px;
            height: 16px;
        }

        .agent-group.expanded .chevron-icon {
            transform: rotate(90deg);
        }

        /* Task List (Children) */
        .task-list {
            margin-left: 22px;
            padding-left: 14px;
            border-left: 1px solid var(--border-subtle);
            margin-top: 4px;
            display: none; /* hidden by default, toggled via JS */
        }

        .agent-group.expanded .task-list {
            display: block;
        }

        .task-item {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            position: relative;
        }

        .task-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .task-item.active {
            background: rgba(255,255,255, 0.03);
            color: var(--text-primary);
        }

        /* Status indicators */
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.progress {
            background: var(--accent-blue);
            box-shadow: 0 0 8px var(--accent-blue);
            animation: pulse 2s infinite;
        }

        .status-dot.waiting {
            background: #FBBF24;
        }

        .status-dot.done {
            background: var(--text-tertiary);
        }
        
        .task-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- 4. Floating Action Button (Hire Agent) --- */
        .fab-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(14, 17, 25, 0.95) 40%, transparent);
            z-index: 20;
        }

        .btn-summon {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-summon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .btn-summon:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
        }

        .btn-summon:hover::before {
            opacity: 0.1;
        }

        .btn-summon span, .btn-summon i {
            position: relative;
            z-index: 1;
        }

        /* --- Main Content Placeholder --- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }
        
        .mock-app-window {
            width: 100%;
            max-width: 800px;
            height: 80%;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            background: rgba(20, 20, 30, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-tertiary);
            box-shadow: 0 24px 48px rgba(0,0,0,0.4);
        }
        
        .mock-app-window i {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <!-- Sidebar Container -->
    <aside class="sidebar">
        
        <!-- 1. Header -->
        <header class="sidebar-header">
            <div class="workspace-info">
                <div class="workspace-avatar">
                    <i data-lucide="hexagon"></i>
                </div>
                <div>
                    <div class="workspace-name">SoulAgent 实验室</div>
                    <div class="workspace-subtitle">Pro Workspace</div>
                </div>
            </div>
            <button class="icon-btn">
                <i data-lucide="panel-left-close"></i>
            </button>
        </header>

        <!-- Scrollable Content -->
        <div class="sidebar-content">
            
            <!-- 2. Dashboard / Inbox -->
            <div class="nav-section">
                <a href="#" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>全局看板</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="bell"></i>
                    <span>收件箱</span>
                    <span class="badge">3</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="search"></i>
                    <span>全局搜索</span>
                </a>
            </div>

            <!-- 3. Your Team -->
            <div class="section-title">
                我的 AI 团队
                <button class="icon-btn" style="width:24px; height:24px;">
                    <i data-lucide="more-horizontal" style="width:14px;"></i>
                </button>
            </div>

            <!-- Agent: Data Analyst -->
            <div class="agent-group expanded">
                <div class="agent-header" onclick="toggleGroup(this)">
                    <div class="agent-avatar blue">
                        <i data-lucide="bar-chart-2" style="width:16px;"></i>
                    </div>
                    <div class="agent-info">
                        <span class="agent-name">Alice</span>
                        <span class="agent-role">数据分析师</span>
                    </div>
                    <i data-lucide="chevron-right" class="chevron-icon"></i>
                </div>
                <div class="task-list">
                    <div class="task-item active">
                        <div class="status-dot progress"></div>
                        <span class="task-title">Q3 营收预测模型</span>
                    </div>
                    <div class="task-item">
                        <div class="status-dot waiting"></div>
                        <span class="task-title">用户流失归因分析 (需确认)</span>
                    </div>
                    <div class="task-item">
                        <div class="status-dot done"></div>
                        <span class="task-title">七月竞品报告</span>
                    </div>
                </div>
            </div>

            <!-- Agent: Copywriter -->
            <div class="agent-group expanded">
                <div class="agent-header" onclick="toggleGroup(this)">
                    <div class="agent-avatar purple">
                        <i data-lucide="feather" style="width:16px;"></i>
                    </div>
                    <div class="agent-info">
                        <span class="agent-name">Bob</span>
                        <span class="agent-role">内容创作者</span>
                    </div>
                    <i data-lucide="chevron-right" class="chevron-icon"></i>
                </div>
                <div class="task-list">
                    <div class="task-item">
                        <div class="status-dot progress"></div>
                        <span class="task-title">产品发布会公关稿</span>
                    </div>
                    <div class="task-item">
                        <div class="status-dot progress"></div>
                        <span class="task-title">Twitter 宣发 Thread</span>
                    </div>
                </div>
            </div>

            <!-- Agent: Code Reviewer -->
            <div class="agent-group">
                <div class="agent-header" onclick="toggleGroup(this)">
                    <div class="agent-avatar green">
                        <i data-lucide="terminal" style="width:16px;"></i>
                    </div>
                    <div class="agent-info">
                        <span class="agent-name">Charlie</span>
                        <span class="agent-role">高级研发</span>
                    </div>
                    <i data-lucide="chevron-right" class="chevron-icon"></i>
                </div>
                <div class="task-list">
                    <div class="task-item">
                        <div class="status-dot waiting"></div>
                        <span class="task-title">重构 Auth 模块 (等待合并)</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- 4. Action Button -->
        <div class="fab-container">
            <button class="btn-summon">
                <i data-lucide="sparkles"></i>
                <span>雇佣新 Agent</span>
            </button>
        </div>

    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="mock-app-window">
            <i data-lucide="mouse-pointer-click"></i>
            <h2>工作区预览</h2>
            <p style="margin-top: 8px;">在左侧选择一个 Agent 的任务进入其专属工作台</p>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Simple Toggle for Accordion
        function toggleGroup(element) {
            const group = element.closest('.agent-group');
            group.classList.toggle('expanded');
        }
        
        // Simple click active state for tasks
        document.querySelectorAll('.task-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.task-item').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
