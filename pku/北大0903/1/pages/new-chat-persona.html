<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建分身对话 - SoulAgent</title>
  <!-- 全局基础样式 -->
  <link rel="stylesheet" href="../css/common.css">

  <!-- 本页面专属 CSS (自包含) -->
  <style>
    .chat-new-view {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      box-sizing: border-box;
      max-width: 820px;
      margin: 0 auto;
      position: relative;
    }

    /* 顶部操作条 (管理分身入口) */
    .clone-top-action-bar {
      position: absolute;
      top: 24px;
      right: 32px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-to-plaza {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .back-to-plaza:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-manage-clone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .btn-manage-clone:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-apply-listing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--primary-color, #8c171e);
      background: var(--primary-color, #8c171e);
      color: #ffffff;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .btn-apply-listing:hover {
      background: #a01823;
      border-color: #a01823;
      transform: translateY(-1px);
    }

    .btn-apply-listing.is-pending {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
    }

    .listing-state-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #059669;
    }

    /* 上架申请弹窗 */
    .listing-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    .listing-modal-card {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      padding: 28px 26px;
      box-sizing: border-box;
    }

    .listing-modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .listing-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .listing-modal-subtitle {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.5;
    }

    .listing-close-btn {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .listing-close-btn:hover {
      background: #f1f5f9;
      color: var(--text-primary);
    }

    .listing-form-group {
      margin-bottom: 14px;
    }

    .listing-form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .listing-form-label .required {
      color: #dc2626;
      margin-left: 2px;
    }

    .listing-form-input,
    .listing-form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-primary);
      background: #f8fafc;
      outline: none;
      box-sizing: border-box;
    }

    .listing-form-input:focus,
    .listing-form-textarea:focus {
      border-color: rgba(140, 23, 30, 0.4);
      background: #ffffff;
    }

    .listing-form-textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
    }
    .listing-email-row {
      display: flex;
      align-items: center;
    }
    .listing-email-row .listing-form-input {
      border-radius: 10px 0 0 10px;
      border-right: none;
    }
    .listing-email-suffix {
      flex-shrink: 0;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-left: none;
      border-radius: 0 10px 10px 0;
      background: #f1f5f9;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .listing-url-row {
      display: flex;
      align-items: center;
    }
    .listing-url-row .listing-form-input {
      border-radius: 0 10px 10px 0;
    }
    .listing-url-prefix {
      flex-shrink: 0;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-right: none;
      border-radius: 10px 0 0 10px;
      background: #f1f5f9;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .listing-form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin: 6px 0 0;
      line-height: 1.5;
    }

    .listing-form-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel-listing {
      padding: 9px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel-listing:hover {
      background: #f1f5f9;
      color: var(--text-primary);
    }

    .btn-submit-listing {
      padding: 9px 18px;
      border-radius: 10px;
      border: 1px solid var(--primary-color, #8c171e);
      background: var(--primary-color, #8c171e);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit-listing:hover {
      background: #a01823;
      border-color: #a01823;
    }

    /* 分身/专家专属介绍卡片 (居中) */
    .clone-intro-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .btn-optimize {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .btn-optimize:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .optimize-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      margin-bottom: 12px;
    }
    .optimize-row-icon { font-size: 20px; line-height: 1; }
    .optimize-row-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .optimize-row-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .optimize-row-desc a {
      color: var(--primary-color, #8c171e);
      font-weight: 600;
      text-decoration: none;
    }
    .optimize-row-desc a:hover { text-decoration: underline; }

    .intro-avatar-box {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      margin-bottom: 16px;
    }

    .intro-avatar-text {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
    }

    .intro-avatar-box svg {
      width: 42px;
      height: 42px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .intro-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .intro-role {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .intro-dept {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .intro-tags-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .intro-tags-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .intro-tag {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .intro-tag-title {
      background: var(--primary-light, #fdf2f2);
      color: var(--primary-color, #8c171e);
    }

    .intro-tag-field {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .intro-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      max-width: 580px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .intro-prompts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 700px;
    }

    .prompt-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .prompt-chip:hover {
      border-color: var(--primary-color, #8c171e);
      background: var(--primary-light, #fdf2f2);
      color: var(--primary-color, #8c171e);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(140, 23, 30, 0.08);
    }

    /* 输入框卡片 */
    .input-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .input-card:focus-within {
      border-color: rgba(140, 23, 30, 0.4);
      box-shadow: 0 8px 30px rgba(140, 23, 30, 0.08);
    }

    .chat-textarea {
      width: 100%;
      min-height: 60px;
      max-height: 160px;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-primary);
      background: transparent;
      padding: 0;
    }

    .input-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-card-bottom-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: #f1f5f9;
      color: var(--text-primary);
    }

    .send-btn {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .send-btn:hover {
      background: #1e293b;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <!-- 侧边栏挂载点 -->
  <div id="sidebar-container"></div>

  <!-- 主内容区 -->
  <main class="main-container" id="main-container">
    <div class="chat-new-view">
      <!-- 返回专家广场入口 -->
      <a class="back-to-plaza" id="back-to-plaza" href="persona-plaza.html" style="display:none;">
        <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>返回 AI 分身广场</span>
      </a>

      <!-- 顶部管理入口 (仅专属分身展示) -->
      <div class="clone-top-action-bar" id="clone-top-action-bar"></div>

      <!-- 分身/专家介绍卡片 (居中展示，无聊天记录) -->
      <div class="clone-intro-card" id="clone-intro-card"></div>

      <!-- 输入卡片 -->
      <div class="input-card">
        <textarea class="chat-textarea" id="chat-input" placeholder="发送消息..."></textarea>
        
        <div class="input-card-bottom">
          <div class="input-card-bottom-left">
            <button type="button" class="action-btn" title="上传附件" onclick="Toast.show('已调起附件选择器')">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
          </div>
          
          <button type="button" class="action-btn send-btn" title="发送" onclick="handleSendFirstMessage()">
            <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff;"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 上架申请弹窗 -->
  <div class="listing-modal-backdrop" id="listing-modal" style="display:none;">
    <div class="listing-modal-card">
      <div class="listing-modal-header">
        <div>
          <div class="listing-modal-title">申请上架到 老师分身广场</div>
          <div class="listing-modal-subtitle">填写申请信息并提交，后台审核通过后即可公开上架，供访客发现与对话。</div>
        </div>
        <button type="button" class="listing-close-btn" onclick="closeListingModal()">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="listing-application-form" onsubmit="submitListingApplication(event)">
        <div class="listing-form-group">
          <label class="listing-form-label" for="listing-contact">邮箱<span class="required">*</span></label>
          <div class="listing-email-row">
            <input class="listing-form-input" type="text" id="listing-contact" name="listing-contact" placeholder="请输入北京大学邮箱前缀" required />
            <span class="listing-email-suffix">@pku.edu.cn</span>
          </div>
        </div>

        <div class="listing-form-group">
          <label class="listing-form-label" for="listing-slug">专属链接</label>
          <div class="listing-url-row">
            <span class="listing-url-prefix">soulagent.world/</span>
            <input class="listing-form-input" type="text" id="listing-slug" name="listing-slug" placeholder="请输入自定义后缀" />
          </div>
          <p class="listing-form-hint">访客可通过此链接直接访问你的分身主页</p>
        </div>

        <div class="listing-form-group">
          <label class="listing-form-label" for="listing-note">申请说明</label>
          <textarea class="listing-form-textarea" id="listing-note" name="listing-note" rows="3" placeholder="请简要说明申请上架的理由"></textarea>
        </div>

        <div class="listing-form-footer">
          <button type="button" class="btn-cancel-listing" onclick="closeListingModal()">取消</button>
          <button type="submit" class="btn-submit-listing">提交申请</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 效果优化弹窗 -->
  <div class="listing-modal-backdrop" id="optimize-modal" style="display:none;">
    <div class="listing-modal-card">
      <div class="listing-modal-header">
        <div>
          <div class="listing-modal-title">效果优化</div>
          <div class="listing-modal-subtitle">对分身效果不满意？可以这样优化</div>
        </div>
        <button type="button" class="listing-close-btn" onclick="closeOptimizeModal()">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="optimize-modal-body"></div>
      <div class="listing-form-footer">
        <button type="button" class="btn-cancel-listing" onclick="closeOptimizeModal()">关闭</button>
      </div>
    </div>
  </div>

  <!-- 引入全局底座与组件 -->
  <script src="../core.js"></script>
  <script src="../components/toast.js"></script>
  <script src="../components/sidebar.js"></script>

  <!-- 本页面专属 JS (自包含) -->
  <script>
    const cloneId = getQueryParam('id');
    const expertId = getQueryParam('expertId');

    let target = null;
    let isClone = false;

    if (expertId) {
      target = (Store.expertList || []).find(e => e.id === expertId);
    } else if (cloneId) {
      target = Store.getClone(cloneId);
      isClone = true;
    } else {
      target = (Store.myClones && Store.myClones[0]) || (Store.expertList && Store.expertList[0]);
      isClone = (target && target.id && target.id.startsWith('clone-'));
    }

    function initPage() {
      if (!target) return;

      document.title = `与 ${target.name} 对话 - SoulAgent`;
      document.getElementById('chat-input').placeholder = `给 ${target.name} 发送消息...`;

      // 顶部操作栏
      renderTopBar();

      // 推荐问题
      let p1 = `请介绍你在【${target.tag || target.role || '专业领域'}】的核心专长与经验`;
      let p2 = `基于你的专属知识库，帮我梳理关键要点`;
      let p3 = `针对当前业务目标，给出落地实施的具体执行建议`;

      if (target.name.includes('诗')) {
        p1 = `以“秋月微风”为题，创作一首七言绝句`;
        p2 = `解析宋词长短句格律与平水韵声律规则`;
        p3 = `规划一组现代抒情诗歌创作意境提纲`;
      } else if (target.name.includes('品牌')) {
        p1 = `为新产品提炼一套极具穿透力的高级文案 Slogan`;
        p2 = `制定面向科技媒体的全案公关传播策略`;
        p3 = `梳理品牌调性塑造与社交媒体爆款策划方案`;
      } else if (target.name.includes('代码') || target.name.includes('审计')) {
        p1 = `排查分布式系统中的高并发死锁与性能瓶颈`;
        p2 = `审查微服务架构的高可用与企业安全编码规范`;
        p3 = `提供模块解耦与代码异味重构优化建议`;
      } else if (target.name.includes('具身') || target.name.includes('王老师')) {
        p1 = `探讨具身智能物理仿真与VLA模型控制`;
        p2 = `Sim-to-Real 跨域迁移算法实践建议`;
        p3 = `机械臂运动轨迹规划策略`;
      } else if (target.name.includes('张院士')) {
        p1 = `探讨国家级人工智能前沿发展战略与顶层架构`;
        p2 = `统一多模态大模型底座的跨域泛化理论`;
        p3 = `大模型与垂类任务因果逻辑链构建方案`;
      }

      const avatarContent = isClone 
        ? `<span class="intro-avatar-text">${escapeHtml(target.avatar || target.name.charAt(0))}</span>`
        : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;

      const titleTags = (target.titles && target.titles.length ? target.titles : [target.role || target.tag || '专家'])
        .map(t => `<span class="intro-tag intro-tag-title">${escapeHtml(t)}</span>`).join('');
      const fieldTags = (target.researchFields && target.researchFields.length ? target.researchFields : [target.tag || '专业领域'])
        .map(f => `<span class="intro-tag intro-tag-field">${escapeHtml(f)}</span>`).join('');

      const roleBadge = isClone
        ? `<div class="intro-role" style="background:#fce7f3;color:#be185d;">${escapeHtml(target.tag || '专属AI分身')} · 我的分身</div>`
        : `<div class="intro-role" style="background:var(--primary-light, #fdf2f2);color:var(--primary-color, #8c171e);">${escapeHtml(target.role || 'AI 分身专家')}</div>`;

      const hasStructuredMeta = !!(target.titles || target.researchFields);
      const metaHtml = hasStructuredMeta
        ? `
          ${target.dept ? `<div class="intro-dept">${escapeHtml(target.dept)}</div>` : ''}
          <div class="intro-tags-block">
            <div class="intro-tags-row">${titleTags}</div>
            <div class="intro-tags-row">${fieldTags}</div>
          </div>
        `
        : roleBadge;

      document.getElementById('clone-intro-card').innerHTML = `
        <div class="intro-avatar-box" style="background: ${target.gradient};">
          ${avatarContent}
        </div>
        <h2 class="intro-name">${escapeHtml(target.name)}</h2>
        ${metaHtml}
        <p class="intro-desc">${escapeHtml(target.desc || '专注于该专业领域的前沿探索与业务支持')}</p>
        <div class="intro-prompts">
          <div class="prompt-chip" onclick="usePrompt('${escapeJsString(p1)}')">💡 ${escapeHtml(p1)}</div>
          <div class="prompt-chip" onclick="usePrompt('${escapeJsString(p2)}')">🎯 ${escapeHtml(p2)}</div>
          <div class="prompt-chip" onclick="usePrompt('${escapeJsString(p3)}')">⚙️ ${escapeHtml(p3)}</div>
        </div>
      `;
    }

    function renderTopBar() {
      const topBar = document.getElementById('clone-top-action-bar');
      const backLink = document.getElementById('back-to-plaza');
      if (!target) {
        topBar.innerHTML = '';
        if (backLink) backLink.style.display = 'none';
        return;
      }

      if (!isClone) {
        topBar.innerHTML = '';
        if (backLink) backLink.style.display = 'inline-flex';
        return;
      }

      const manageHtml = `
        <a class="btn-manage-clone" href="${getPageUrl('persona-plaza.html', { id: target.id, view: 'mine' })}">
          <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>管理分身</span>
        </a>
      `;

      const optimizeHtml = `
        <button type="button" class="btn-optimize" onclick="openOptimizeModal()">
          <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>
          <span>效果优化</span>
        </button>
      `;

      let applyHtml = '';
      if (target.publishedToPlaza) {
        applyHtml = `<span class="listing-state-chip">已上架至广场</span>`;
      } else if (target.listingApplication && target.listingApplication.status === 'pending') {
        applyHtml = `<button type="button" class="btn-apply-listing is-pending" disabled>上架审核中</button>`;
      } else {
        applyHtml = `<button type="button" class="btn-apply-listing" onclick="openListingModal()">申请上架到老师分身广场</button>`;
      }

      topBar.innerHTML = manageHtml + optimizeHtml + applyHtml;
      if (backLink) {
        backLink.style.display = 'none';
      }
    }

    function openOptimizeModal() {
      if (!target) return;
      const body = document.getElementById('optimize-modal-body');
      if (!body) return;
      const knowledgeUrl = getPageUrl('persona-plaza.html', { id: target.id, view: 'mine', tab: 'files' });
      const settingsUrl = getPageUrl('persona-plaza.html', { id: target.id, view: 'mine', tab: 'settings' });
      body.innerHTML = `
        <div class="optimize-row">
          <div class="optimize-row-icon">📚</div>
          <div>
            <div class="optimize-row-title">回答不够准</div>
            <div class="optimize-row-desc">前往 <a href="${knowledgeUrl}">分身知识</a>，补充或修正资料。</div>
          </div>
        </div>
        <div class="optimize-row">
          <div class="optimize-row-icon">🎭</div>
          <div>
            <div class="optimize-row-title">风格不够像</div>
            <div class="optimize-row-desc">前往 <a href="${knowledgeUrl}">分身知识</a> 添加聊天记录、访谈、演讲等内容，再前往 <a href="${settingsUrl}">分身设定</a> 重新学习思维与表达风格。</div>
          </div>
        </div>
      `;
      const modal = document.getElementById('optimize-modal');
      if (modal) modal.style.display = 'flex';
    }

    function closeOptimizeModal() {
      const modal = document.getElementById('optimize-modal');
      if (modal) modal.style.display = 'none';
    }

    function openListingModal() {
      if (!target) return;
      const form = document.getElementById('listing-application-form');
      let contact = (target.listingApplication && target.listingApplication.contact) || '';
      if (contact.endsWith('@pku.edu.cn')) contact = contact.slice(0, -'@pku.edu.cn'.length);
      form.elements['listing-contact'].value = contact;
      form.elements['listing-slug'].value = (target.settings && target.settings.homeSlug) || 'wangzhongyuan';
      form.elements['listing-note'].value = (target.listingApplication && target.listingApplication.note) || '';
      document.getElementById('listing-modal').style.display = 'flex';
    }

    function closeListingModal() {
      document.getElementById('listing-modal').style.display = 'none';
    }

    function submitListingApplication(event) {
      event.preventDefault();
      if (!target) return;

      const form = document.getElementById('listing-application-form');
      const contactPrefix = form.elements['listing-contact'].value.trim();
      const slug = form.elements['listing-slug'].value.trim();
      const note = form.elements['listing-note'].value.trim();
      if (!contactPrefix) { Toast.show('请填写北京大学邮箱前缀'); return; }
      if (!/^[a-zA-Z0-9._-]+$/.test(contactPrefix)) {
        Toast.show('邮箱前缀仅支持字母、数字及 . _ -');
        return;
      }
      if (!slug) { Toast.show('请填写专属链接后缀'); return; }
      if (!/^[a-zA-Z0-9_-]+$/.test(slug)) {
        Toast.show('链接后缀仅支持字母、数字、下划线和短横线');
        return;
      }
      const application = {
        contact: `${contactPrefix}@pku.edu.cn`,
        note,
        status: 'pending',
        submittedAt: new Date().toISOString()
      };

      Store.updateClone(target.id, { listingApplication: application });
      target = Store.getClone(target.id);
      if (!target.settings) target.settings = {};
      target.settings.homeSlug = slug;
      Store.save();
      closeListingModal();
      Toast.show('申请已提交，等待后台审核');
      renderTopBar();
    }

    document.getElementById('listing-modal').addEventListener('click', (event) => {
      if (event.target.id === 'listing-modal') closeListingModal();
    });

    function usePrompt(text) {
      document.getElementById('chat-input').value = text;
      handleSendFirstMessage();
    }

    function handleSendFirstMessage() {
      const inputEl = document.getElementById('chat-input');
      const text = inputEl.value.trim();
      if (!text) {
        Toast.show('请输入消息内容');
        return;
      }

      // 根据提问生成唯一会话标题，避免覆盖旧 session
      let baseTitle = text.length > 22 ? text.substring(0, 22) + '...' : text;
      let sessionTitle = baseTitle;
      let count = 1;
      while (Store.getAgentChats("AI助手").includes(sessionTitle)) {
        sessionTitle = `${baseTitle} (${count++})`;
      }

      let replyHtml = '';
      if (!isClone && target) {
        const opinion = getExpertOpinion(target, text);
        replyHtml = `
          <p>你好！我是<strong>${escapeHtml(target.name)}</strong>的 AI 分身。</p>
          <p>很高兴与你交流！关于“${escapeHtml(text)}”，结合我的专业研究，我有以下见解：</p>
          <div style="line-height:1.6;color:var(--text-primary);margin:8px 0;">${escapeHtml(opinion)}</div>
          <p>随时提出更具体的问题，我们可以共同深入探讨！</p>
        `;
      } else if (isClone && target) {
        replyHtml = getCloneOpinion(target, text);
      }

      // 创建历史会话并写入第一条用户消息与对应专家/分身回复
      Store.createConversation(sessionTitle, {
        type: isClone ? 'clone' : 'expert',
        expertId: !isClone ? target.id : undefined,
        cloneId: isClone ? target.id : undefined,
        messages: [
          { role: 'user', content: text },
          {
            role: 'assistant',
            expertId: !isClone ? target.id : undefined,
            cloneId: isClone ? target.id : undefined,
            htmlContent: replyHtml
          }
        ]
      }, target.name, isClone ? 'clone' : 'expert', target.id);

      window.location.href = getPageUrl('chat-dialog.html', {
        title: sessionTitle
      });
    }

    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendFirstMessage();
      }
    });

    initPage();
  </script>
</body>

</html>
