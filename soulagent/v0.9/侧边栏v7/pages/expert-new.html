<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专家对话</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <!-- 左侧边栏挂载点 -->
  <div id="sidebar-container"></div>

  <!-- 右侧主内容区 -->
  <main class="main-container" id="main-container">
    <div class="chat-new-view is-expert" id="expert-new-view">
      <div class="expert-intro-card" id="expert-intro-card">
        <!-- 动态注入专家介绍 -->
      </div>

      <div class="input-card">
        <textarea class="chat-textarea" id="chat-input" placeholder="发送消息..."></textarea>
        
        <div class="input-card-bottom">
          <div class="input-card-bottom-left">
            <button type="button" class="action-btn" title="上传附件" onclick="showToast('已调起附件选择器')">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
          </div>
          
          <button type="button" class="action-btn send-btn" title="发送" onclick="handleSendExpertChat()">
            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 引入核心脚本 -->
  <script src="../js/data.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const expertId = getQueryParam('id') || (window.expertList && window.expertList[0] ? window.expertList[0].id : 'exp-zhang');
    const exp = (window.expertList || []).find(e => e.id === expertId) || (window.expertList && window.expertList[0]);

    function initPage() {
      if (!exp) return;

      document.title = `与 ${exp.name}的AI分身 对话 - SoulAgent`;
      document.getElementById('chat-input').placeholder = `给 ${exp.name}的AI分身 发送消息...`;

      const p1 = `探讨 ${exp.tag || '人工智能'} 前沿发展路线`;
      const p2 = `请介绍您的代表性研究成果与经验`;
      const p3 = `如何与 SoulAgent 结合实践落地`;

      document.getElementById('expert-intro-card').innerHTML = `
        <div class="intro-avatar-box" style="background: ${exp.gradient};">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="intro-meta">
          <h2 class="intro-name">${escapeHtml(exp.agentName || exp.name + '的AI分身')}</h2>
          <div class="intro-role">${escapeHtml(exp.role || 'AI 分身专家')}</div>
          <p class="intro-desc">${escapeHtml(exp.desc)}</p>
        </div>
        <div class="intro-prompts">
          <div class="prompt-chip" onclick="usePrompt('${escapeJsString(p1)}')">💡 ${escapeHtml(p1)}</div>
          <div class="prompt-chip" onclick="usePrompt('${escapeJsString(p2)}')">🎯 ${escapeHtml(p2)}</div>
          <div class="prompt-chip" onclick="usePrompt('${escapeJsString(p3)}')">⚙️ ${escapeHtml(p3)}</div>
        </div>
      `;
    }

    function handleSendExpertChat() {
      handleSendNewChat(exp.id, null);
    }

    initPage();
  </script>
</body>

</html>
