<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI分身广场 - SoulAgent</title>
  <!-- 全局基础样式 -->
  <link rel="stylesheet" href="../css/common.css">

  <!-- 本页面专属 CSS (自包含) -->
  <style>
    .plaza-page-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      background: transparent;
    }

    .page-header {
      padding: 24px 36px 20px 36px;
      border-bottom: 1px solid var(--border-color, #e5e7eb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .page-title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .page-avatar-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f3e8ff;
      border: 1px solid #e9d5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary, #0f172a);
      line-height: 1.2;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-secondary, #64748b);
      margin-top: 4px;
    }

    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 广场主体内容区 */
    .plaza-body {
      padding: 24px 36px 60px 36px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* 专家卡片网格 */
    .expert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .expert-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .expert-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(140, 23, 30, 0.08);
      border-color: rgba(140, 23, 30, 0.25);
    }

    .expert-avatar-container {
      position: relative;
      margin-bottom: 14px;
    }

    .expert-avatar-box {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      transition: transform 0.25s ease;
    }

    .expert-card:hover .expert-avatar-box {
      transform: scale(1.06);
    }

    .expert-avatar-box svg {
      width: 42px;
      height: 42px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .expert-status-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #ffffff;
    }

    .expert-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .expert-role {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--primary-color, #8c171e);
      background: var(--primary-light, #fdf2f2);
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: inline-block;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expert-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 38px;
    }

    .expert-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-muted);
      width: 100%;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      margin-top: auto;
      transition: opacity 0.2s ease;
    }

    .expert-card-hover-action {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 16px 16px 16px;
      background: linear-gradient(to top, #ffffff 85%, rgba(255, 255, 255, 0));
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .expert-card:hover .expert-card-hover-action {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .expert-card:hover .expert-footer {
      opacity: 0.15;
    }

    .btn-chat-now {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      background: #0f172a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-chat-now:hover {
      background: #1e293b;
      transform: scale(1.02);
    }

    /* 多选模式样式 */
    .expert-grid.is-select-mode .expert-card-hover-action {
      display: none !important;
    }

    .expert-grid.is-select-mode .expert-footer {
      opacity: 1 !important;
    }

    .expert-card.selectable {
      cursor: pointer;
      user-select: none;
    }

    .expert-card.is-selected {
      border-color: #7c3aed;
      background: #faf5ff;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.25), 0 10px 24px rgba(124, 58, 237, 0.12);
    }

    .expert-card-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .expert-card.is-selected .expert-card-checkbox {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #ffffff;
    }

    .expert-card-checkbox svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transition: all 0.15s ease;
    }

    .expert-card.is-selected .expert-card-checkbox svg {
      opacity: 1;
    }

    /* 底部浮动操作条 */
    .plaza-bottom-bar {
      position: sticky;
      bottom: 20px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 16px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.15);
      backdrop-filter: blur(12px);
      z-index: 100;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .plaza-bottom-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .plaza-bottom-count {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .plaza-bottom-count strong {
      color: #7c3aed;
      font-size: 16px;
    }

    .plaza-selected-avatars {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .plaza-avatar-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px 3px 4px;
      border-radius: 20px;
      background: #f3e8ff;
      color: #6b21a8;
      font-size: 11.5px;
      font-weight: 500;
    }

    .plaza-avatar-pill-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
    }

    .plaza-bottom-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-launch-group {
      background: var(--primary-gradient, linear-gradient(135deg, #8c171e, #b91c1c));
      color: #ffffff;
      border: none;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(140, 23, 30, 0.3);
      transition: all 0.2s ease;
    }

    .btn-launch-group:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(140, 23, 30, 0.4);
    }
  </style>
</head>

<body>
  <!-- 侧边栏挂载点 -->
  <div id="sidebar-container"></div>

  <!-- 主内容区 -->
  <main class="main-container" id="main-container">
    <div class="plaza-page-view">
      <!-- 顶部 Header -->
      <div class="page-header">
        <div class="page-title-group">
          <div class="page-avatar-badge">
            <svg class="icon" viewBox="0 0 24 24" style="width:22px;height:22px;stroke:#7c3aed;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div>
            <h1 class="page-title">AI分身广场</h1>
            <p class="page-subtitle">探索并对话各个领域的行业专家与权威智囊分身，获取即时专业的分析与建议</p>
          </div>
        </div>

        <div class="page-header-actions">
          <button class="btn" id="btn-group-toggle" onclick="toggleGroupSelectMode()">
            <svg class="icon" id="btn-group-icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="btn-group-text">发起群聊</span>
          </button>
          <a class="btn btn-primary" href="persona-distill.html" style="text-decoration:none;">
            <span>+ 创建我的分身</span>
          </a>
        </div>
      </div>

      <!-- 广场主体内容 -->
      <div class="plaza-body">
        <!-- 专家网格 -->
        <div class="expert-grid" id="expert-grid"></div>

        <!-- 底部操作条 (多选群聊模式下激活) -->
        <div class="plaza-bottom-bar" id="plaza-bottom-bar" style="display: none;">
          <div class="plaza-bottom-left">
            <div class="plaza-bottom-count">
              已选择 <strong id="selected-count">0</strong> 位专家分身
            </div>
            <div class="plaza-selected-avatars" id="selected-avatars-container"></div>
          </div>

          <div class="plaza-bottom-right">
            <button type="button" class="btn" onclick="selectAllExperts()" style="font-size:12.5px;padding:6px 12px;">全选</button>
            <button type="button" class="btn" onclick="clearSelectedExperts()" style="font-size:12.5px;padding:6px 12px;">清空</button>
            <button type="button" class="btn-launch-group" onclick="launchGroupChat()">
              <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#fff;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>立即发起群聊</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 引入全局底座与组件 -->
  <script src="../core.js"></script>
  <script src="../components/toast.js"></script>
  <script src="../components/sidebar.js"></script>

  <!-- 本页面专属 JS (自包含) -->
  <script>
    let isSelectMode = false;
    let selectedExpertIds = new Set();

    function getAllPlazaExperts() {
      const presets = Store.expertList || [];
      const publishedClones = (Store.myClones || []).filter(c => c.publishedToPlaza);
      return [...presets, ...publishedClones];
    }

    function toggleGroupSelectMode() {
      isSelectMode = !isSelectMode;
      const toggleText = document.getElementById('btn-group-text');
      const toggleIcon = document.getElementById('btn-group-icon');
      const bottomBar = document.getElementById('plaza-bottom-bar');
      const expertGrid = document.getElementById('expert-grid');

      if (isSelectMode) {
        toggleText.innerText = '退出多选';
        toggleIcon.innerHTML = `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`;
        bottomBar.style.display = 'flex';
        expertGrid.classList.add('is-select-mode');
      } else {
        toggleText.innerText = '发起群聊';
        toggleIcon.innerHTML = `<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`;
        bottomBar.style.display = 'none';
        expertGrid.classList.remove('is-select-mode');
        selectedExpertIds.clear();
      }

      renderExpertGrid();
      updateBottomBar();
    }

    function toggleExpertSelect(expertId, event) {
      if (event) event.stopPropagation();
      if (!isSelectMode) return;

      if (selectedExpertIds.has(expertId)) {
        selectedExpertIds.delete(expertId);
      } else {
        selectedExpertIds.add(expertId);
      }

      renderExpertGrid();
      updateBottomBar();
    }

    function selectAllExperts() {
      getAllPlazaExperts().forEach(e => selectedExpertIds.add(e.id));
      renderExpertGrid();
      updateBottomBar();
    }

    function clearSelectedExperts() {
      selectedExpertIds.clear();
      renderExpertGrid();
      updateBottomBar();
    }

    function updateBottomBar() {
      document.getElementById('selected-count').innerText = selectedExpertIds.size;
      const avatarContainer = document.getElementById('selected-avatars-container');
      const allExperts = getAllPlazaExperts();
      const selectedList = allExperts.filter(e => selectedExpertIds.has(e.id));

      avatarContainer.innerHTML = selectedList.map(e => `
        <span class="plaza-avatar-pill">
          <span class="plaza-avatar-pill-dot" style="background:${e.gradient};">${escapeHtml(e.name.charAt(0))}</span>
          <span>${escapeHtml(e.name)}</span>
        </span>
      `).join('');
    }

    function renderExpertGrid() {
      const experts = getAllPlazaExperts();
      const grid = document.getElementById('expert-grid');

      if (experts.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-muted);">暂无专家分身</div>`;
        return;
      }

      grid.innerHTML = experts.map(exp => {
        const isSelected = selectedExpertIds.has(exp.id);
        const cardClickHandler = isSelectMode 
          ? `onclick="toggleExpertSelect('${exp.id}', event)"`
          : `onclick="startChatWithExpert('${exp.id}')"`;

        const checkboxHtml = isSelectMode ? `
          <div class="expert-card-checkbox" onclick="toggleExpertSelect('${exp.id}', event)">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        ` : '';

        return `
          <div class="expert-card ${isSelectMode ? 'selectable' : ''} ${isSelected ? 'is-selected' : ''}" ${cardClickHandler}>
            ${checkboxHtml}
            <div class="expert-avatar-container">
              <div class="expert-avatar-box" style="background: ${exp.gradient};">
                <svg viewBox="0 0 24 24">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="expert-status-badge"></div>
            </div>
            <div class="expert-name">${escapeHtml(exp.name)}</div>
            <div class="expert-role">${escapeHtml(exp.role || exp.tag || '专家分身')}</div>
            <div class="expert-desc">${escapeHtml(exp.desc || '专注于该专业领域的前沿探索与决策支持')}</div>

            <div class="expert-footer">
              <span>${escapeHtml(exp.stat || '已就绪')}</span>
              <span>·</span>
              <span>${exp.publishedToPlaza ? '公开分身' : '专家分身'}</span>
            </div>

            <div class="expert-card-hover-action">
              <button class="btn-chat-now" onclick="startChatWithExpert('${exp.id}'); event.stopPropagation();">
                <svg class="icon" style="width:14px;height:14px;stroke:#fff;" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>新建对话</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function startChatWithExpert(expertId) {
      const expert = getAllPlazaExperts().find(e => e.id === expertId);
      if (!expert) return;

      if (expert.publishedToPlaza || (expert.id && expert.id.startsWith('clone-'))) {
        window.location.href = getPageUrl('new-chat-persona.html', { id: expert.id });
      } else {
        window.location.href = getPageUrl('new-chat-persona.html', { expertId: expert.id });
      }
    }

    function launchGroupChat() {
      if (selectedExpertIds.size === 0) {
        Toast.show('请至少勾选 1 位专家分身发起群聊！');
        return;
      }

      const allExperts = getAllPlazaExperts();
      const selectedExperts = allExperts.filter(e => selectedExpertIds.has(e.id));
      const names = selectedExperts.map(e => e.name);

      let baseTitle = '';
      if (names.length === 1) {
        baseTitle = `${names[0]} 专家群聊`;
      } else if (names.length === 2) {
        baseTitle = `${names[0]}、${names[1]} 专家群聊`;
      } else {
        baseTitle = `${names[0]}、${names[1]} 等专家群聊`;
      }

      let sessionTitle = baseTitle;
      let count = 1;
      while (Store.getAgentChats("AI助手").includes(sessionTitle)) {
        sessionTitle = `${baseTitle} (${count++})`;
      }

      const firstQuery = `各位专家好（${names.join('、')}），我想就跨领域前沿技术与方案协同探讨向大家请教。`;
      
      Store.createConversation(sessionTitle, {
        type: 'group',
        expertIds: Array.from(selectedExpertIds),
        messages: [
          { role: 'user', content: firstQuery }
        ]
      }, '多专家群聊', 'group');

      Toast.show(`正在创建【${sessionTitle}】...`);

      setTimeout(() => {
        window.location.href = getPageUrl('chat-dialog.html', {
          title: sessionTitle,
          autoGroup: 'true'
        });
      }, 300);
    }

    renderExpertGrid();
  </script>
</body>

</html>
