<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创建专家档案 · SoulAgent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #6C63FF; --accent-light: #8B85FF; --accent-dark: #4A42D6;
      --surface: rgba(255,255,255,0.84); --surface-hover: rgba(255,255,255,0.96);
      --border: rgba(108,99,255,0.18); --border-active: rgba(108,99,255,0.55);
      --text-primary: #1a1a2e; --text-secondary: #5a5a7a; --text-muted: #9090b0;
      --tag-bg: rgba(108,99,255,0.10); --tag-color: #5a52d5;
      --danger: #ff5a5a; --success: #22c55e;
      --radius: 16px; --radius-sm: 10px;
      --shadow: 0 8px 40px rgba(60,40,120,0.14);
    }
    html, body { height: 100%; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text-primary); }
    body { position: relative; min-height: 100vh; overflow-x: hidden; }

    .bg-layer { position: fixed; inset: 0; background: url("banner1220.jpg") center center / cover no-repeat; opacity: 0.15; z-index: 0; pointer-events: none; }
    .bg-tint { position: fixed; inset: 0; background: linear-gradient(135deg, #f0eeff 0%, #fdf6ff 60%, #fff5f0 100%); z-index: 0; pointer-events: none; }

    /* ── Page shell ── */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 52px 20px 80px; }

    /* ── Shared header ── */
    .header { width: 100%; max-width: 860px; margin-bottom: 32px; text-align: center; }
    .header-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--tag-bg); color: var(--tag-color); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border-active); margin-bottom: 16px; }
    .header h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; line-height: 1.3; }
    .header p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; max-width: 480px; margin: 0 auto; }

    /* ── Main card ── */
    .main-card { width: 100%; max-width: 600px; background: var(--surface); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; padding: 48px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }

    /* ── Animated visual ── */
    .visual-container { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
    .pulse-circle { position: absolute; border: 2px solid var(--accent); border-radius: 50%; opacity: 0; animation: scalePulse 3s cubic-bezier(0.21, 0.6, 0.35, 1) infinite; }
    .pulse-circle:nth-child(1) { animation-delay: 0s; }
    .pulse-circle:nth-child(2) { animation-delay: 1s; }
    .pulse-circle:nth-child(3) { animation-delay: 2s; }
    
    @keyframes scalePulse {
      0% { width: 60px; height: 60px; opacity: 0.8; border-color: var(--accent); }
      100% { width: 160px; height: 160px; opacity: 0; border-color: var(--accent-light); }
    }

    .icon-box { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-light)); box-shadow: 0 8px 24px rgba(108,99,255,0.4); display: flex; align-items: center; justify-content: center; z-index: 2; position: relative; }
    .icon-box svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; animation: float 4s ease-in-out infinite; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ── Text contents ── */
    .status-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; }
    .status-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; max-width: 440px; margin-bottom: 32px; }

    /* ── Progress pipeline ── */
    .pipeline { width: 100%; max-width: 380px; text-align: left; background: rgba(108,99,255,0.03); border: 1px solid rgba(108,99,255,0.08); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 32px; }
    .pipe-step { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; }
    .pipe-step:last-child { margin-bottom: 0; }
    .pipe-step:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 22px; bottom: -12px; width: 2px; background: rgba(108,99,255,0.1); }
    .pipe-step.done:not(:last-child)::after { background: var(--success); opacity: 0.5; }

    .step-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; z-index: 1; }
    .pipe-step.done .step-icon { background: var(--success); color: #fff; }
    .pipe-step.active .step-icon { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px rgba(108,99,255,0.2); animation: stepPulse 1.5s infinite; }
    .pipe-step.pending .step-icon { background: rgba(108,99,255,0.1); color: var(--text-muted); }

    @keyframes stepPulse {
      0% { box-shadow: 0 0 0 0px rgba(108,99,255,0.4); }
      100% { box-shadow: 0 0 0 6px rgba(108,99,255,0); }
    }

    .step-text { font-size: 13.5px; font-weight: 500; color: var(--text-secondary); }
    .pipe-step.active .step-text { color: var(--text-primary); font-weight: 600; }
    .pipe-step.done .step-text { color: var(--text-muted); text-decoration: line-through; opacity: 0.8; }

    /* ── Info Box ── */
    .info-box { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: rgba(255, 140, 0, 0.08); border: 1px solid rgba(255, 140, 0, 0.2); border-radius: var(--radius-sm); padding: 14px 18px; width: 100%; max-width: 460px; }
    .info-box svg { width: 18px; height: 18px; stroke: #d4830a; stroke-width: 2.2; fill: none; flex-shrink: 0; margin-top: 2px; }
    .info-content { font-size: 12.5px; color: #b46b00; line-height: 1.6; }
    .info-content strong { font-weight: 600; }

    @media (max-width: 600px) {
      .main-card { padding: 32px 20px; }
      .pipeline { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="bg-tint"></div>
<div class="bg-layer"></div>

<div class="page">

  <!-- ── Header ── -->
  <div class="header" id="main-header">
    <div class="header-badge">
      <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="5"/></svg>
      SoulAgent · 专家分身档案
    </div>
    <h1 id="header-title">分身构建中</h1>
    <p id="header-desc">您的个人专属专家 AI 分身正在深度定制与训练中。</p>
  </div>

  <!-- ── Main card ── -->
  <div class="main-card">
    
    <!-- Pulse Visual animation -->
    <div class="visual-container">
      <div class="pulse-circle"></div>
      <div class="pulse-circle"></div>
      <div class="pulse-circle"></div>
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
    </div>

    <div class="status-title">分身正在构建中...</div>
    

    <!-- Pipeline steps -->
     <!--
    <div class="pipeline">
      <div class="pipe-step done">
        <span class="step-icon">✓</span>
        <span class="step-text">基本信息与课件资料解析</span>
      </div>
      <div class="pipe-step active">
        <span class="step-icon">2</span>
        <span class="step-text">构建专属的专属向量知识库</span>
      </div>
      <div class="pipe-step pending">
        <span class="step-icon">3</span>
        <span class="step-text">微调与人设表达训练</span>
      </div>
      <div class="pipe-step pending">
        <span class="step-icon">4</span>
        <span class="step-text">分身服务正式部署上线</span>
      </div>
    </div>
-->
    <!-- Info message block -->
    <div class="info-box">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <div class="info-content">
        如果需要补充、修改资料，请联系 <strong>管理员</strong>。
      </div>
    </div>

  </div>

</div>
</body>
</html>
